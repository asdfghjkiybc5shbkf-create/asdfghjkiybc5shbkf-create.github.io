
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithRedirect,
  getRedirectResult,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  sendEmailVerification,
  sendPasswordResetEmail,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAXcp4kU3UXsQygFZcZ-CkFrKkBgak53Q",
  authDomain: "myweb-dddb3.firebaseapp.com",
  projectId: "myweb-dddb3",
  storageBucket: "myweb-dddb3.firebasestorage.app",
  messagingSenderId: "655059266329",
  appId: "1:655059266329:web:9f3c81205c0f1de3c23388",
  measurementId: "G-EKREB5DRC1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const googleProvider = new GoogleAuthProvider();
const $ = id => document.getElementById(id);

const root = document.documentElement;
const emailInput = $("email");
const passwordInput = $("password");

let busy = false;
let currentUser = null;

/* ===== پیام‌ها و مدیریت دکمه‌ها ===== */
function message(text) {
  $("accountStatus").textContent = text;
}

function dashMessage(text) {
  $("dashStatus").textContent = text;
}

function setBusy(value) {
  busy = value;

  ["googleButton", "signupButton", "loginButton", "resetButton"]
    .forEach(id => {
      const button = $(id);
      if (button) button.disabled = value;
    });
}

function errorMessage(error) {
  const messages = {
    "auth/email-already-in-use": "این ایمیل قبلاً ثبت شده است.",
    "auth/invalid-email": "فرمت ایمیل صحیح نیست.",
    "auth/weak-password": "رمز عبور باید حداقل ۶ نویسه باشد.",
    "auth/invalid-credential": "ایمیل یا رمز عبور اشتباه است.",
    "auth/user-not-found": "حسابی با این مشخصات پیدا نشد.",
    "auth/wrong-password": "رمز عبور اشتباه است.",
    "auth/unauthorized-domain": "دامنه سایت در Firebase مجاز نیست.",
    "auth/operation-not-allowed": "این روش ورود در Firebase فعال نیست.",
    "auth/network-request-failed": "اتصال اینترنت را بررسی کن.",
    "auth/too-many-requests": "تلاش‌های زیادی انجام شده؛ بعداً دوباره امتحان کن.",
    "auth/popup-closed-by-user": "فرایند ورود لغو شد.",
    "auth/invalid-action-code": "درخواست معتبر نیست؛ دوباره امتحان کن."
  };

  return messages[error.code] || "خطا: " + (error.message || error.code);
}

function formatDateTime(dateValue) {
  if (!dateValue) return "—";

  const date = new Date(dateValue);
  if (Number.isNaN(date.getTime())) return "—";

  return new Intl.DateTimeFormat("fa-IR", {
    calendar: "persian",
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  }).format(date);
}

/* ===== تم روشن و تاریک ===== */
function applyTheme(theme) {
  const safeTheme = theme === "light" ? "light" : "dark";

  root.setAttribute("data-theme", safeTheme);
  $("themeToggle").textContent = safeTheme === "light" ? "☀️" : "🌙";
  $("themeToggle").title =
    safeTheme === "light" ? "فعال‌کردن حالت تاریک" : "فعال‌کردن حالت روشن";

  try {
    localStorage.setItem("myspace-theme", safeTheme);
  } catch {}
}

let savedTheme = "dark";

try {
  savedTheme = localStorage.getItem("myspace-theme") || "dark";
} catch {}

applyTheme(savedTheme);

$("themeToggle").addEventListener("click", () => {
  const nextTheme =
    root.getAttribute("data-theme") === "light" ? "dark" : "light";

  applyTheme(nextTheme);
});

/* ===== ساعت و تاریخ شمسی ===== */
const islandModes = ["time", "date"];
let islandIndex = 0;

function renderIsland() {
  const now = new Date();
  const mode = islandModes[islandIndex];

  const icon = $("islandIcon");
  const main = $("islandMain");
  const sub = $("islandSub");

  if (mode === "time") {
    icon.textContent = "🕰️";
    main.removeAttribute("dir");

    main.textContent = new Intl.DateTimeFormat("fa-IR", {
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    }).format(now);

    sub.textContent = "ساعت محلی دستگاه";
  } else {
    icon.textContent = "📅";
    main.setAttribute("dir", "rtl");

    main.textContent = new Intl.DateTimeFormat("fa-IR", {
      calendar: "persian",
      weekday: "long",
      day: "numeric",
      month: "long"
    }).format(now);

    sub.textContent = "تاریخ امروز";
  }

  [0, 1].forEach(i => {
    $("dot" + i).classList.toggle("active", i === islandIndex);
  });
}

function cycleIsland() {
  islandIndex = (islandIndex + 1) % islandModes.length;
  renderIsland();
}

renderIsland();
setInterval(renderIsland, 1000);

$("island").addEventListener("click", cycleIsland);

$("island").addEventListener("keydown", event => {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    cycleIsland();
  }
});

/* ===== باز و بسته‌کردن داشبورد ===== */
function openDashboard() {
  $("dashboardOverlay").hidden = false;
}

function closeDashboard() {
  $("dashboardOverlay").hidden = true;
}

$("menuButton").addEventListener("click", openDashboard);
$("closeDashboard").addEventListener("click", closeDashboard);
$("overlayBackdrop").addEventListener("click", closeDashboard);

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeDashboard();
});

/* ===== نمایش اطلاعات حساب ===== */
function renderUser(user) {
  currentUser = user;

  $("loginBox").hidden = !!user;
  $("dashboardBox").hidden = !user;

  if (!user) return;

  $("dashName").textContent =
    user.displayName || (user.email ? user.email.split("@")[0] : "کاربر");

  $("dashEmail").textContent = user.email || "ایمیل ثبت نشده";
  $("dashUid").textContent = "UID: " + user.uid;

  const verified = user.emailVerified || user.providerData.some(
    provider => provider.providerId === "google.com"
  );

  $("dashVerifiedBadge").textContent =
    verified ? "تأیید شده ✓" : "تأیید نشده";

  $("dashVerifiedBadge").className =
    "dash-badge " + (verified ? "ok" : "warn");

  const createdAt = user.metadata.creationTime;
  const lastLogin = user.metadata.lastSignInTime;

  $("dashCreated").textContent = formatDateTime(createdAt);
  $("dashLastLogin").textContent = formatDateTime(lastLogin);
}

/* ===== بررسی نتیجه ورود گوگل ===== */
try {
  const result = await getRedirectResult(auth);

  if (result?.user) {
    message("ورود با موفقیت انجام شد!");
    openDashboard();
  }
} catch (error) {
  message(errorMessage(error));
}

/* ===== ورود با گوگل ===== */
$("googleButton").addEventListener("click", async () => {
  if (busy) return;

  setBusy(true);
  message("در حال انتقال به گوگل…");

  try {
    await signInWithRedirect(auth, googleProvider);
  } catch (error) {
    message(errorMessage(error));
    setBusy(false);
  }
});

/* ===== ثبت‌نام با ایمیل ===== */
$("emailForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (busy) return;

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  setBusy(true);
  message("در حال ساخت حساب…");

  try {
    const credential = await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );

    try {
      await sendEmailVerification(credential.user);
      message("حساب ساخته شد؛ ایمیلت را برای تأیید بررسی کن.");
    } catch {
      message("حساب ساخته شد، اما ارسال ایمیل تأیید ناموفق بود.");
    }
  } catch (error) {
    message(errorMessage(error));
  } finally {
    setBusy(false);
  }
});

/* ===== ورود با ایمیل ===== */
$("loginButton").addEventListener("click", async () => {
  if (busy) return;

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!email || !password) {
    message("ایمیل و رمز عبور را وارد کن.");
    return;
  }

  setBusy(true);
  message("در حال ورود…");

  try {
    await signInWithEmailAndPassword(auth, email, password);
    message("با موفقیت وارد شدی!");
    openDashboard();
  } catch (error) {
    message(errorMessage(error));
  } finally {
    setBusy(false);
  }
});

/* ===== بازیابی رمز عبور ===== */
$("resetButton").addEventListener("click", async () => {
  if (busy) return;

  const email = emailInput.value.trim();

  if (!email) {
    message("ابتدا ایمیلت را وارد کن.");
    emailInput.focus();
    return;
  }

  setBusy(true);
  message("در حال ارسال ایمیل بازیابی…");

  try {
    await sendPasswordResetEmail(auth, email);
    message("اگر حسابی با این ایمیل وجود داشته باشد، لینک بازیابی ارسال می‌شود.");
  } catch (error) {
    message(errorMessage(error));
  } finally {
    setBusy(false);
  }
});

/* ===== خروج از حساب ===== */
$("logoutButton").addEventListener("click", async () => {
  if (busy) return;

  setBusy(true);
  dashMessage("در حال خروج…");

  try {
    await signOut(auth);
    message("از حساب خارج شدی.");
    closeDashboard();
  } catch (error) {
    dashMessage(errorMessage(error));
  } finally {
    setBusy(false);
  }
});

/* ===== هماهنگ‌سازی رابط با وضعیت واقعی ورود ===== */
onAuthStateChanged(auth, user => {
  renderUser(user);

  if (user) {
    setBusy(false);
  }
});

/* ===== دکمه خرید نمایشی ===== */
$("buyButton").addEventListener("click", () => {
  $("buyStatus").textContent =
    "خرید آنلاین هنوز فعال نیست؛ این دکمه فعلاً نمایشی است.";
});
</script>
</body>
</html>
